    <script>
      (function pxomxdAuth() {
        const form = document.querySelector('#login-form');
        const actions = document.querySelector('[data-auth-actions]');
        const profileIcon = '👤';
        const adminIcon = '🛡️';
        const renderProfile = (session) => {
          const isAdmin = session?.role === 'admin';
          actions.innerHTML = `<a class="flex items-center justify-center bg-zinc-900 text-white hover:bg-black rounded-full w-9 h-9 transition-all" href="/profile" aria-label="Profile" title="${isAdmin ? 'Admin Profile' : 'User Profile'}"><span aria-hidden="true">${isAdmin ? adminIcon : profileIcon}</span></a>`;
        };
        const existing = localStorage.getItem('pxomxd:user') || localStorage.getItem('pxomxd:admin');
        if (existing) renderProfile(JSON.parse(existing));
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const login = document.querySelector('#username').value;
          const password = form.querySelector('input[name="password"]').value;
          const role = login.trim().toLowerCase().startsWith('admin:') ? 'admin' : 'user';
          const cleanLogin = login.trim().replace(/^admin:/i, '');
          try {
            const session = await window.pxomxdBackend.login({ login: cleanLogin, password, role });
            renderProfile(session);
            window.appAlert({ type: 'success', title: 'เข้าสู่ระบบสำเร็จ', message: 'กำลังพาไปหน้าโปรไฟล์...' });
            window.setTimeout(() => { window.location.href = '/profile'; }, 500);
          } catch (error) {
            window.appAlert({ type: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', message: error.message });
          }
        });
      })();
    </script>
