        theme: {
          extend: {

              mint: { DEFAULT: '#1FAE7A', soft: '#E7F7F0' },
              ember: { DEFAULT: '#FF6B4A', soft: '#FFEDE8' }
            },
            fontFamily: {
              display: ['Space Grotesk', 'sans-serif'],
              body: ['Inter', 'sans-serif']
